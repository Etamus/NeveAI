<!doctype html>
<html lang="en" spellcheck="false">
	<head>
		<meta charset="utf-8" />
		<script>
			(() => {
				const desktopSessionKey = 'neve-desktop-window';
				let isDesktopWindow = new URLSearchParams(window.location.search).has('neve-desktop');

				try {
					if (isDesktopWindow) {
						sessionStorage.setItem(desktopSessionKey, '1');
					} else {
						isDesktopWindow = sessionStorage.getItem(desktopSessionKey) === '1';
					}
				} catch {
					// The URL marker still handles the initial desktop load when storage is unavailable.
				}

				const favicon = document.createElement('link');
				favicon.rel = 'icon';
				favicon.type = isDesktopWindow ? 'image/png' : 'image/x-icon';
				favicon.href = isDesktopWindow
					? 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAE0lEQVR4nGNgGAWjYBSMAgYwAAAEEAABsax5zAAAAABJRU5ErkJggg=='
					: '/static/faviconbar.ico?v=72b9cf03';
				document.head.appendChild(favicon);
			})();
		</script>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/static/favicon.png"
			crossorigin="use-credentials"
		/>
		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script src="/static/loader.js" defer crossorigin="use-credentials"></script>
		<link rel="stylesheet" href="/static/custom.css" crossorigin="use-credentials" />

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			(() => {
				const disableSpellcheck = (element) => {
					if (!(element instanceof HTMLElement)) return;
					if (element.matches('input, textarea, [contenteditable]')) {
						element.setAttribute('spellcheck', 'false');
					}
				};

				document.addEventListener('DOMContentLoaded', () => {
					document.querySelectorAll('input, textarea, [contenteditable]').forEach(disableSpellcheck);
				});
				document.addEventListener('focusin', (event) => disableSpellcheck(event.target), true);
				document.addEventListener('input', (event) => disableSpellcheck(event.target), true);
			})();
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');

				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				})();
		</script>

		<title>&#8203;&#8204;</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" spellcheck="false">
		<div style="display: contents">%sveltekit.body%</div>


	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}
	</style>
</html>
