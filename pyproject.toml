[project]
name = "neve-ai"
description = "Neve"
authors = [
    { name = "Etamus", email = "" }
]
license = { file = "LICENSE.txt" }
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",

    "python-socketio==5.17.0",
    "cryptography",
    "PyJWT==2.15.1",
    "authlib==1.8.0",

    "requests==2.34.2",
    "aiohttp==3.14.3",
    "async-timeout",
    "aiocache",
    "aiofiles",
    "starlette-compress==1.8.0",
    "Brotli==1.2.0",
    "httpx[socks,http2,zstd,cli,brotli]==0.28.1",
    "python-mimeparse==2.0.0",

    "sqlalchemy==2.0.48",
    "alembic==1.20.0",
    "peewee==3.19.0",
    "peewee-migrate==1.14.3",

    "redis",

    "pytz==2026.4",

    "loguru==0.7.3",
    "asgiref==3.12.1",

    "tiktoken",
    "mcp==1.26.0",

    "langchain==1.4.3",
    "langchain-community==0.4.2",
    "langchain-classic==1.0.8",
    "langchain-text-splitters==1.1.2",

    "fake-useragent==2.2.0",
    "chromadb==1.5.9",
    "transformers==5.18.0",
    "sentence-transformers==5.2.3",
    "hf-xet==1.6.0",
    "accelerate",
    "gguf>=0.10.0",
    "pyarrow==20.0.0", # fix: pin pyarrow version to 20 for rpi compatibility #15897
    "einops==0.8.2",

    "ftfy==6.3.1",
    "chardet==5.2.0",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "lxml==6.1.3",
    "striprtf==0.0.33",
    "fpdf2==2.8.9",
    "pymdown-extensions==12.1",
    "docx2txt==0.9",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "unstructured==0.18.31",
    "msoffcrypto-tool==6.0.0",
    "nltk==3.10.3",
    "Markdown==3.11",
    "pypandoc==1.17",
    "trafilatura==2.3.0",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "pyxlsb==1.0.10",
    "xlrd==2.0.2",
    "validators==0.35.0",
    "psutil",
    "sentencepiece",
    "soundfile==0.13.1",
    "pillow==12.3.0",
    "opencv-python-headless==4.13.0.92",
    "rapidocr-onnxruntime==1.4.4",
    "rank-bm25==0.2.2",

    "onnxruntime==1.30.0",
    "faster-whisper==1.2.1",

    "black==26.5.1",
    "youtube-transcript-api==1.2.4",

    "pydub",
    "ddgs==9.16.0",

]
readme = "README.md"
requires-python = ">= 3.11, < 3.13.0a1"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.scripts]
neve-ai = "neveai:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["backend/neveai"]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".*secret_key",
    "dev.sh",
    "requirements.txt",
    "start.sh",
    "start_windows.bat",
    "*.db",
    "chroma.sqlite3",
]
force-include = { build = "neveai/frontend" }
[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'
